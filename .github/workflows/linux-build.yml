# Build the desktop shell for Linux x64 (AppImage + deb) without touching the
# macOS/Windows release matrix. Tauri on Linux hosts the window with WebKitGTK,
# so this job must run on a Linux runner: the child browser panel is a native
# view and cannot be cross-built from macOS.
#
# The native browser panel is macOS (WKWebView) and Windows (WebView2) only.
# On Linux the control API still starts, but the descriptor advertises no
# `browser-panel` capability, so dsh-web-review falls back to its CDP/proxy
# preview modes instead of asking for a panel that cannot be served.
name: Linux x64 build

on:
  push:
    branches: ['linux/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11'

jobs:
  build:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm ci

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev pkg-config file xvfb \
            libgdk-pixbuf2.0-bin librsvg2-bin libglib2.0-bin
          sudo apt-get install -y --no-install-recommends libfuse2t64 \
            || sudo apt-get install -y --no-install-recommends libfuse2 || true

      - name: Prepare runtime
        run: npm run prepare:runtime

      # `targets: "all"` in tauri.conf.json would also attempt rpm on Linux, so
      # name the two bundles this build actually wants.
      - name: Build deb
        run: npx tauri build --bundles deb

      # AppImage bundling shells out to linuxdeploy, which needs FUSE; the
      # extract-and-run path also works in containers without it. Either way a
      # failure here must not discard the deb that already built.
      - name: Build AppImage
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx tauri build --bundles appimage

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          cp src-tauri/target/release/bundle/deb/*.deb release/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/ 2>/dev/null || true
          ls -la release
          test -n "$(ls -A release)"
          (cd release && sha256sum ./* > SHA256SUMS.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-shell-linux-x64
          path: release/*
          if-no-files-found: error

      # Prove the packaged runtime boots on Linux by extracting the deb and
      # starting the bundled Harness server with the bundled Node binary.
      - name: Smoke test the bundled Harness
        run: |
          set -euo pipefail
          deb="$(find release -maxdepth 1 -name '*.deb' -print -quit)"
          echo "deb: $deb"
          root="$(mktemp -d)"
          dpkg-deb -x "$deb" "$root"
          # resources/node/bin/node -> resources/
          node_bin="$(find "$root" -path '*/resources/node/bin/node' -print -quit)"
          echo "node: $node_bin"
          test -x "$node_bin"
          harness_dir="$(dirname "$(dirname "$(dirname "$node_bin")")")/harness"
          echo "harness: $harness_dir"
          test -f "$harness_dir/node_modules/@deepseek-ai/dsh/lib/bin.js"
          "$node_bin" --version
          export DSH_HOME="$(mktemp -d)"
          log="$(mktemp)"
          port=18999
          (cd "$harness_dir" && exec "$node_bin" node_modules/@deepseek-ai/dsh/lib/bin.js \
            web --no-open --host 127.0.0.1 --port "$port") >"$log" 2>&1 &
          pid=$!
          # The bare root answers 401; the shell navigates to the token URL the
          # Harness prints, so this smoke test follows that same URL.
          url=""
          for _ in $(seq 1 45); do
            url="$(awk '/dsh web: /{ sub(/^.*dsh web: /, ""); split($0, parts, / /); print parts[1]; exit }' "$log")"
            [ -n "$url" ] && break
            sleep 2
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$log"
          test -n "$url"
          code="$(curl -s -L -c "$root/cookies" -b "$root/cookies" -o /dev/null -w '%{http_code}' "$url")"
          echo "token url responded with HTTP $code"
          case "$code" in
            2*|3*) exit 0 ;;
            *) exit 1 ;;
          esac
