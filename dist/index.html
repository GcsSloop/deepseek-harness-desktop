<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8fc; color: #1e2430; }
      main { text-align: center; }
      img { width: 112px; height: 112px; border-radius: 24px; box-shadow: 0 14px 38px rgba(48, 77, 180, .18); }
      h1 { margin: 22px 0 8px; font-size: 21px; font-weight: 650; }
      p { margin: 0; color: #6d7481; font-size: 14px; }
      .dots::after { content: ""; animation: dots 1.5s steps(4, end) infinite; }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
      @media (prefers-color-scheme: dark) { body { background: #12151b; color: #f3f5f9; } p { color: #9ba3b1; } }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="DeepSeek" />
      <h1>DeepSeek Harness</h1>
      <p>正在启动本地服务<span class="dots"></span></p>
    </main>
  </body>
</html>
